name: Deploy Infrastructure

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'terraform/**'
      - 'modules/**'
      - 'app/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - 'modules/**'
      - 'app/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  TF_VERSION: 1.5.0
  AWS_REGION: us-east-1

jobs:
  test:
    name: 'Run Tests'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install pytest boto3 moto flask flask-cors

    - name: Run Lambda tests
      run: |
        pytest tests/test_lambda.py -v

    - name: Run Backend tests
      run: |
        pytest tests/test_backend.py -v

  terraform:
    name: 'Terraform'
    needs: test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        environment: [dev]
        # environment: [dev, staging, prod]
    
    environment: ${{ matrix.environment }}
    
    defaults:
      run:
        working-directory: ./terraform
        
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: ${{ env.TF_VERSION }}

    - name: Terraform Format
      id: fmt
      run: terraform fmt -check
      continue-on-error: true

    - name: Terraform Init
      id: init
      run: |
        terraform init \
          -backend-config="bucket=dreamsquad-terraform-state-${{ matrix.environment }}" \
          -backend-config="key=${{ matrix.environment }}/terraform.tfstate" \
          -backend-config="region=${{ env.AWS_REGION }}"

    - name: Terraform Validate
      id: validate
      run: terraform validate

    - name: Terraform Plan
      id: plan
      if: github.event_name == 'pull_request'
      run: terraform plan -var="environment=${{ matrix.environment }}" -no-color

    - name: Terraform Apply
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
      run: terraform apply -var="environment=${{ matrix.environment }}" -auto-approve

    - name: Terraform Output
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
      id: output
      run: |
        echo "BACKEND_URL=$(terraform output -raw backend_url)" >> $GITHUB_ENV
        echo "FRONTEND_URL=$(terraform output -raw frontend_url)" >> $GITHUB_ENV
        echo "API_URL=$(terraform output -raw backend_api_url)" >> $GITHUB_ENV

    - name: Create Deployment Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const output = `## Terraform Plan
          
          **Environment**: ${{ matrix.environment }}
          
          **Terraform Format**: ${{ steps.fmt.outcome }}
          **Terraform Init**: ${{ steps.init.outcome }}
          **Terraform Validate**: ${{ steps.validate.outcome }}
          
          *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })
